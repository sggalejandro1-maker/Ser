<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background-color: #0b0e11;
            color: #eaecef;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #22252a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 22px; color: #f0b90b; }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .stats-badge {
            background-color: #171a1e;
            border: 1px solid #2b313a;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #eaecef;
        }
        .win-rate { color: #0ecb81; font-weight: bold; }
        .timer-box {
            background-color: #1e2329;
            border: 1px solid #2b313a;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #f0b90b;
            font-weight: bold;
        }
        .status-live {
            background-color: #0ecb81;
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Panel de Configuración */
        .config-card {
            background-color: #1e2329;
            border: 1px solid #f0b90b55;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .config-title {
            font-size: 13px;
            font-weight: bold;
            color: #f0b90b;
            text-transform: uppercase;
        }
        .profile-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-profile {
            background-color: #171a1e;
            border: 1px solid #2b313a;
            color: #848e9c;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-profile:hover {
            border-color: #f0b90b;
            color: #eaecef;
        }
        .btn-profile.active {
            background-color: #f0b90b;
            color: #000;
            border-color: #f0b90b;
        }
        .btn-audio {
            background-color: #2b313a;
            border: 1px solid #848e9c;
            color: #eaecef;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-audio.active {
            background-color: #0ecb81;
            color: #000;
            border-color: #0ecb81;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
